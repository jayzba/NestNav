name: Collect traffic

# Records one live commute reading per city every 30 minutes into Firestore.
# Needs repo secrets: FIREBASE_SERVICE_ACCOUNT, MAPBOX_TOKEN.
on:
  schedule:
    - cron: '7,37 * * * *'   # off the top of the hour, when GitHub's queue is busiest
  workflow_dispatch:

concurrency:
  group: collect-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
      - run: node collect.js traffic
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
